<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0B131D">
<title>Fact Franchise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B131D; --panel:#131F2C; --panel2:#1B2A3A; --line:#27394D;
  --text:#ECF2F8; --muted:#8FA3B8; --amber:#FFB627; --amber-ink:#241800;
  --good:#3DDC84; --warn:#F2994A; --bad:#FF5A5F; --team:#2E5EAA;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 Barlow,system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
  background:radial-gradient(60% 40% at 15% -5%,rgba(255,220,140,.10),transparent 70%),radial-gradient(60% 40% at 85% -5%,rgba(160,200,255,.10),transparent 70%)}
.wrap{max-width:1100px;margin:0 auto;padding:16px;padding-bottom:calc(32px + env(safe-area-inset-bottom,0px));padding-top:calc(16px + env(safe-area-inset-top,0px))}
.display{font-family:Teko,Impact,"Arial Narrow",sans-serif;text-transform:uppercase;letter-spacing:.02em;line-height:.9;font-weight:600}
.muted{color:var(--muted)}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{margin:0;text-wrap:balance}
button{font:inherit;color:inherit}
.btn{font:600 17px/1 Barlow,system-ui,sans-serif;padding:14px 20px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer;touch-action:manipulation;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px}
.btn:hover{border-color:#3a5470}
.btn.primary{background:var(--amber);color:var(--amber-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.06)}
.btn.big{font-family:Teko,Impact,sans-serif;font-size:34px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;padding:14px 28px 8px;min-height:64px}
.btn.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible,.link:focus-visible,.tile:focus-visible,.swatch:focus-visible,.key:focus-visible,.cell:focus-visible{outline:3px solid #fff;outline-offset:2px}
.link{background:none;border:0;color:var(--muted);cursor:pointer;padding:8px 0;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.link:hover{color:var(--text)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.stack{display:grid;gap:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
.tnum{font-variant-numeric:tabular-nums}
.ico{width:1em;height:1em;flex:none}

/* ---------- home ---------- */
.masthead{display:grid;gap:6px;padding-block:18px 26px}
.masthead h1{font-size:clamp(56px,11vw,104px)}
.masthead h1 span{color:var(--amber)}
.statstrip{display:flex;gap:28px;flex-wrap:wrap;margin-top:6px}
.statstrip b{display:block;font-family:Teko,sans-serif;font-size:32px;line-height:1;font-weight:600}
.frgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.frcard{border-radius:14px;overflow:hidden;background:var(--panel);border:1px solid var(--line);cursor:pointer;text-align:left;padding:0;display:flex;flex-direction:column;transition:transform .15s}
.frcard:hover{transform:translateY(-2px)}
.frcard .top{background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 55%,#000));padding:18px 18px 14px;display:grid;gap:4px;position:relative;min-height:112px}
.frcard .top .ico{position:absolute;right:14px;top:14px;font-size:40px;opacity:.55}
.frcard .city{font-size:15px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.frcard .name{font-size:44px}
.frcard .meta{display:flex;justify-content:space-between;gap:8px;padding:12px 18px;font-weight:600;font-size:15px}
.pinit{width:58px;height:58px;border-radius:50%;background:rgba(0,0,0,.25);display:grid;place-items:center;font-size:42px;padding-top:6px}
.pchip{background:var(--c);color:#fff;font-weight:700;padding:6px 14px;border-radius:999px;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.codebig{font-family:Teko,sans-serif;font-size:44px;font-weight:600;letter-spacing:.04em;line-height:1;background:var(--bg);border:1px dashed var(--line);border-radius:12px;padding:12px 16px 6px;user-select:all;-webkit-user-select:all;overflow-wrap:anywhere}
.frcard.new{border:2px dashed var(--line);background:transparent;align-items:center;justify-content:center;min-height:170px;color:var(--muted);gap:6px}
.frcard.new .display{font-size:34px;color:var(--text)}
.frcard.new:hover{border-color:var(--amber)}

/* ---------- new franchise ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.tile{background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:16px 10px 12px;cursor:pointer;display:grid;justify-items:center;gap:8px;touch-action:manipulation}
.tile .ico{font-size:44px}
.tile .display{font-size:28px}
.tile[aria-pressed="true"]{border-color:var(--amber);background:color-mix(in srgb,var(--amber) 14%,var(--panel2))}
label.fld{display:grid;gap:6px;font-weight:600;flex:1 1 220px}
input.txt{font:600 20px Barlow,sans-serif;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);width:100%}
input.txt:focus{outline:2px solid var(--amber);outline-offset:1px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{width:46px;height:46px;border-radius:50%;border:3px solid transparent;cursor:pointer;background:var(--c);box-shadow:inset 0 0 0 2px rgba(0,0,0,.25)}
.swatch[aria-pressed="true"]{border-color:#fff}
.preview{border-radius:14px;padding:22px;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 50%,#000));display:flex;align-items:center;gap:16px}
.preview .ico{font-size:56px;opacity:.8}
.preview .name{font-size:52px}

/* ---------- hub ---------- */
.banner{border-radius:16px;padding:24px;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 45%,#000));display:grid;gap:4px;position:relative;overflow:hidden}
.banner .ico{position:absolute;right:-10px;bottom:-24px;font-size:170px;opacity:.14}
.banner .name{font-size:clamp(52px,10vw,86px)}
.banner .city{font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.9}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi b{display:block;font-family:Teko,sans-serif;font-size:40px;line-height:1;font-weight:600;margin-top:4px}
.kpi .neg{color:var(--bad)}
.pips{display:flex;gap:6px;margin-top:8px}
.pip{width:22px;height:8px;border-radius:4px;background:var(--line)}
.pip.on{background:var(--amber)}
.playrow{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.upgrades{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.upg{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:10px;align-content:start}
.upg h3{font-size:26px}
.upg .lv{display:flex;gap:5px}
.upg .lv i{width:18px;height:18px;border-radius:4px;background:var(--line)}
.upg .lv i.on{background:var(--good)}
.traincard{border-radius:14px;padding:18px 20px;background:linear-gradient(90deg,#16331f,#1a3a24);border:1px solid #2f6b40;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.steps{display:grid;gap:10px}
.step{display:flex;align-items:baseline;gap:14px;padding:12px 16px;border-radius:12px;background:var(--bg);border:1px solid var(--line);animation:fadeup .45s both}
.step .n{font-family:Teko,sans-serif;font-size:22px;color:var(--muted);font-weight:600;min-width:1.2em}
.step .p{font-size:20px;font-weight:600;flex:1}
.step .v{font-family:Teko,sans-serif;font-size:44px;line-height:.9;font-weight:600;color:var(--amber)}
.step.last-step{border-color:var(--amber)}
.bigfact{font-family:Teko,Impact,sans-serif;font-size:clamp(72px,14vw,112px);font-weight:600;line-height:.9;text-align:center}
.pairs{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:flex-start}
.pair{display:grid;gap:5px;justify-items:center;padding:7px 8px 4px;border:2px dashed var(--amber);border-radius:12px}
.pair.left{border-color:var(--good)}
.g5{display:flex;gap:3px;padding:5px 6px;border-radius:8px;background:var(--panel2);border:1px solid var(--line)}
.g5 i{width:11px;height:11px;border-radius:50%;background:#C9D3DD}
.pair .g5 + .g5 i{background:#7DB3FF}
.pair.left .g5 i{background:var(--good)}
.pair .b1{color:#C9D3DD}
.pair .b2{color:#7DB3FF}
.pair b{font-family:Teko,sans-serif;font-size:20px;line-height:1;font-weight:600;color:var(--amber)}
.pair.left b{color:var(--good)}
.plays{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.play{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:6px;text-align:left;cursor:pointer}
.play:hover{border-color:var(--amber)}
.play .x{font-family:Teko,sans-serif;font-size:40px;line-height:.9;font-weight:600;color:var(--amber)}
.play h3{font-size:26px}
.progress{display:flex;gap:6px}
.progress i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.progress i.on{background:var(--good)}
.sharkcard{border-radius:14px;padding:18px 20px;background:linear-gradient(90deg,#0f2e44,#12324a);border:1px solid #2a5878;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.fin{width:54px;height:54px;flex:none}
.trophies{display:flex;gap:12px;flex-wrap:wrap}
.trophy{display:grid;justify-items:center;gap:4px;width:110px;text-align:center;font-size:13px;font-weight:600;color:var(--muted)}
.trophy svg{width:52px;height:52px}
.deal{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-weight:600}
.deal:first-child{border-top:0}

/* ---------- game ---------- */
.gamebar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.game{display:grid;gap:16px}
@media (min-width:880px){.game{grid-template-columns:1.25fr 1fr;align-items:start}}
.board{display:grid;grid-template-columns:1fr auto 1fr;background:#05090E;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.tm{padding:10px 14px 6px;display:grid;gap:0;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 70%,#000),color-mix(in srgb,var(--c) 35%,#000))}
.tm.opp{text-align:right}
.tm .abbr{font-family:Teko,sans-serif;font-size:26px;font-weight:600;letter-spacing:.06em;line-height:1}
.tm .sc{font-family:Teko,sans-serif;font-size:clamp(56px,9vw,84px);font-weight:600;line-height:.9;color:#FFE9A8;text-shadow:0 0 18px rgba(255,200,80,.35)}
.tm .sc.bump{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.25)}}
.mid{padding:10px 14px;display:grid;align-content:center;justify-items:center;gap:2px;min-width:92px}
.mid .per{font-family:Teko,sans-serif;font-size:30px;font-weight:600;color:var(--amber);line-height:1}
.mid .pn{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.field{position:relative;height:120px;border-radius:14px;margin-top:12px;overflow:hidden;border:1px solid var(--line)}
.field .end{position:absolute;top:0;bottom:0;width:9%;display:flex;align-items:center;justify-content:center}
.field .end.l{left:0;background:color-mix(in srgb,var(--us) 85%,#000)}
.field .end.r{right:0;background:color-mix(in srgb,var(--them) 85%,#000)}
.field .end span{writing-mode:vertical-rl;transform:rotate(180deg);font-family:Teko,sans-serif;font-size:18px;letter-spacing:.2em;font-weight:600;opacity:.85}
.ball{position:absolute;top:50%;left:50%;width:26px;height:26px;transform:translate(-50%,-50%);transition:left .6s cubic-bezier(.3,.8,.3,1);filter:drop-shadow(0 3px 3px rgba(0,0,0,.45))}
.s-football{background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 2px),rgba(255,255,255,.45) calc(10% - 2px) 10%),linear-gradient(#2f7d3b,#276a31)}
.s-basketball{background:radial-gradient(circle at 50% 50%,transparent 0 30px,rgba(255,255,255,.7) 30px 32px,transparent 32px),linear-gradient(90deg,transparent calc(50% - 1px),rgba(255,255,255,.7) calc(50% - 1px) calc(50% + 1px),transparent calc(50% + 1px)),repeating-linear-gradient(90deg,#c98b4b 0 24px,#bd7f42 24px 48px)}
.s-baseball{background:radial-gradient(ellipse 55% 95% at 50% 110%,#b07a4a 0 60%,transparent 61%),linear-gradient(#2f7d3b,#276a31)}
.s-soccer{background:radial-gradient(circle at 50% 50%,transparent 0 30px,rgba(255,255,255,.6) 30px 32px,transparent 32px),linear-gradient(90deg,transparent calc(50% - 1px),rgba(255,255,255,.6) calc(50% - 1px) calc(50% + 1px),transparent calc(50% + 1px)),repeating-linear-gradient(90deg,#2e8b3e 0 12.5%,#287a36 12.5% 25%)}
.s-hockey{background:linear-gradient(90deg,transparent calc(50% - 2px),#d83b3b calc(50% - 2px) calc(50% + 2px),transparent calc(50% + 2px)),linear-gradient(90deg,transparent calc(33% - 3px),#2f63c9 calc(33% - 3px) 33%,transparent 33%,transparent calc(67% - 3px),#2f63c9 calc(67% - 3px) 67%,transparent 67%),linear-gradient(#eef5fa,#d9e7f0)}
.call{margin-top:12px;min-height:58px;padding:14px 16px;background:var(--panel);border:1px solid var(--line);border-radius:12px;font-size:19px;font-weight:600;display:flex;align-items:center;gap:10px}
.call.good{border-color:color-mix(in srgb,var(--good) 60%,var(--line))}
.call.bad{border-color:color-mix(in srgb,var(--bad) 60%,var(--line))}
.qpanel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px}
.side{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chip{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:6px 10px;border-radius:999px}
.chip.o{background:color-mix(in srgb,var(--good) 20%,transparent);color:var(--good)}
.chip.d{background:color-mix(in srgb,#7DB3FF 20%,transparent);color:#9CC4FF}
.streak{font-weight:700;color:var(--amber);font-size:15px}
.q{font-family:Teko,Impact,sans-serif;font-size:clamp(84px,15vw,128px);font-weight:600;line-height:.85;text-align:center;padding-top:10px;letter-spacing:.02em}
.q small{font-size:.45em;color:var(--muted)}
.ansbox{font-family:Teko,sans-serif;font-size:60px;font-weight:600;line-height:1;text-align:center;padding:10px 0 4px;border-radius:12px;background:var(--bg);border:2px solid var(--line);min-height:76px}
.ansbox.empty{color:#3d546c}
.ansbox.right{border-color:var(--good);color:var(--good)}
.ansbox.wrong{border-color:var(--bad);color:var(--bad);font-size:44px;padding-top:16px}
.timer{height:12px;border-radius:6px;background:var(--bg);overflow:hidden;border:1px solid var(--line)}
.timer i{display:block;height:100%;width:100%;background:var(--good);transform-origin:left;border-radius:6px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.key{font-family:Teko,sans-serif;font-size:42px;font-weight:600;line-height:1;padding:12px 0 6px;min-height:68px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.key:active{background:#27405a;transform:scale(.97)}
.key.alt{font-family:Barlow,sans-serif;font-size:22px;padding:0}
.key.ok{background:var(--amber);color:var(--amber-ink);border-color:transparent}

.banner-fx{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:50}
.banner-fx span{font-family:Teko,Impact,sans-serif;font-weight:700;font-size:clamp(72px,16vw,180px);text-transform:uppercase;color:#FFE9A8;text-shadow:0 0 40px rgba(255,180,40,.7),0 6px 0 #000;animation:slam 1.3s cubic-bezier(.2,.9,.2,1) forwards;letter-spacing:.02em;text-align:center;line-height:.85;padding:0 16px}
@keyframes slam{0%{transform:scale(2.4);opacity:0}18%{transform:scale(.95);opacity:1}28%{transform:scale(1)}80%{opacity:1}100%{transform:scale(1.05);opacity:0}}

/* ---------- postgame / shark ---------- */
.final{display:grid;gap:8px;text-align:center;padding-block:10px 4px}
.final .res{font-size:clamp(80px,16vw,140px)}
.res.W{color:var(--good)} .res.L{color:var(--bad)} .res.T{color:var(--amber)}
.twocol{display:grid;gap:16px}
@media (min-width:880px){.twocol{grid-template-columns:1fr 1fr;align-items:start}}
.ledger{display:grid;gap:0}
.ledger div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-weight:600}
.ledger div:first-child{border-top:0}
.ledger .tot{border-top:2px solid var(--text);font-size:20px}
.plus{color:var(--good)} .minus{color:var(--bad)}
.bizq{font-size:21px;font-weight:600;line-height:1.35}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cmp > div{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}
.cmp b{display:block;font-family:Teko,sans-serif;font-size:52px;line-height:1;font-weight:600}
.quote{font-size:21px;font-weight:500;line-height:1.4;border-left:4px solid var(--amber);padding-left:14px}

/* ---------- coach ---------- */
.heat{overflow-x:auto}
.heat table{border-collapse:separate;border-spacing:4px;margin:0 auto}
.heat th{font-family:Teko,sans-serif;font-size:22px;font-weight:600;color:var(--muted);width:40px;height:34px}
.cell{width:40px;height:40px;border-radius:8px;border:0;cursor:pointer;font:700 13px Barlow,sans-serif;color:rgba(0,0,0,.65);padding:0}
.cell.off{opacity:.25}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;font-weight:600;color:var(--muted);justify-content:center}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{background:transparent;border:0;padding:10px 14px;font-weight:600;cursor:pointer;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--amber);color:var(--amber-ink)}
.trouble{display:flex;gap:8px;flex-wrap:wrap}
.trouble span{font-family:Teko,sans-serif;font-size:26px;font-weight:600;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px 10px 0}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;display:grid;gap:8px;width:min(92vw,440px);pointer-events:none}
#toast div{background:#F4F7FA;color:#0B131D;font-weight:700;padding:12px 16px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.45);animation:tin .3s ease-out}
@keyframes tin{from{transform:translateY(12px);opacity:0}}
/* ---------- lock-in (shown after a miss) ---------- */
#coreModal{align-items:start}
.lockin{position:fixed;inset:0;z-index:70;background:rgba(5,9,14,.9);display:grid;place-items:center;padding:16px;overflow-y:auto}
.li-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px 22px;width:min(540px,100%);display:grid;gap:16px;text-align:center}
.li-fact{font-family:Teko,Impact,sans-serif;font-size:clamp(84px,19vw,150px);font-weight:600;line-height:.9;display:flex;justify-content:center;align-items:baseline;gap:.22em;flex-wrap:wrap;padding-top:8px}
.li-q{animation:fadeup .6s both}
.li-ans{color:var(--amber);opacity:0;display:inline-block}
.li-ans.show{animation:pop .7s forwards}
.li-type{display:grid;gap:12px}
.li-type .ansbox{font-size:52px}
.shake{animation:shake .35s}
@keyframes fadeup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

<script>
"use strict";
/* ================= helpers ================= */
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const chance = p => Math.random() < p;
// All money in the game is counted in millions: 60 -> $60M, 1250 -> $1.25B.
const amt = n => { n = Math.abs(Math.round(n)); return n >= 1000 ? '$' + (+(n/1000).toFixed(2)) + 'B' : '$' + n + 'M'; };
const money = n => (n<0?'−':'') + amt(n);
const signed = n => (n<0?'−':'+') + amt(n);
const today = () => new Date().toISOString().slice(0,10);

/* ================= save data ================= */
// Storage keys keep the original 'franchise-tycoon' names so saves survive the rename to Fact Franchise.
const KEY = 'franchise-tycoon.v1';
function fresh(){ return {v:1, facts:{}, franchises:[], unlocked:10, ways:{},
  settings:{range:'auto', timer:'auto', timerV:2, sound:true}, pace:3, paceV:2,
  stats:{answered:0, correct:0, bestStreak:0, days:{}}}; }
function normalize(o){ const s = Object.assign(fresh(), o||{}); s.settings = Object.assign(fresh().settings, s.settings); s.stats = Object.assign(fresh().stats, s.stats); s.updated = s.updated || 0;
  if(!o || !o.settings || o.settings.timerV !== 2){ s.settings.timer = 'auto'; s.settings.timerV = 2; }  // saves from before the adaptive clock
  if(o && o.paceV !== 2 && typeof o.pace === 'number'){ s.pace = o.pace + 2; s.paceV = 2; }  // clock gained 30s and 20s steps at the slow end
  s.pace = Math.min(PACE.length-1, Math.max(0, s.pace|0)); return s; }
// Adaptive game clock: 3 right in a row -> one step faster; 2 misses -> one step slower.
const PACE = [30, 20, 15, 12, 10, 8, 6.5, 5];
const clockSecs = () => S.settings.timer==='auto' ? PACE[S.pace] : +S.settings.timer;
/* ================= players ================= */
// The family is a list of players; each player has their own save (teams, facts, clock, settings).
// S always points at the save of the player on this device (ME).
const FAM_KEY = 'franchise-tycoon.family', PLAYER_KEY = 'franchise-tycoon.player';
const PLAYER_COLORS = ['#2E5EAA','#D7263D','#2BA84A','#F46036','#6C3FB5','#0FA3B1','#E84A8A','#F5B700'];
const newId = () => 'p' + Math.random().toString(36).slice(2,10);
const newPlayer = (name, color, save) => ({id:newId(), name, color, updated:Date.now(), save: save || normalize(null)});
let FAM;
try { FAM = JSON.parse(localStorage.getItem(FAM_KEY)); } catch(e){}
if(!FAM || !Array.isArray(FAM.players)){
  FAM = {players:[]};
  let old = null; try { old = JSON.parse(localStorage.getItem(KEY)); } catch(e){}
  // Progress from before profiles becomes the first player (rename it in Coach's Office).
  if(old && ((old.franchises && old.franchises.length) || (old.stats && old.stats.answered))) FAM.players.push(newPlayer('Player 1', PLAYER_COLORS[0], normalize(old)));
}
FAM.players.forEach(p => { if(!p.deleted) p.save = normalize(p.save); });
const livePlayers = () => FAM.players.filter(p => !p.deleted);
let ME = null, S = normalize(null);
function setMe(id){
  ME = livePlayers().find(p => p.id===id) || null;
  S = ME ? ME.save : normalize(null);
  try { ME ? localStorage.setItem(PLAYER_KEY, ME.id) : localStorage.removeItem(PLAYER_KEY); } catch(e){}
}
{ let last = ''; try { last = localStorage.getItem(PLAYER_KEY) || ''; } catch(e){}
  setMe(last || (livePlayers().length===1 ? livePlayers()[0].id : '')); }
function saveLocal(){ try { localStorage.setItem(FAM_KEY, JSON.stringify(FAM)); } catch(e){} }

/* ================= cloud save (Vercel Blob via /api/save) ================= */
const CODE_KEY = 'franchise-tycoon.code';
const Cloud = {
  code: (()=>{ try { return localStorage.getItem(CODE_KEY) || ''; } catch(e){ return ''; } })(),
  status: 'off', lastSync: 0, timers: {}, error: '', email: null,
  get usable(){ return /^https?:$/.test(location.protocol); },
  url(code, pid){ return '/api/save?code=' + encodeURIComponent(code) + (pid ? '&player=' + pid : ''); },
  setCode(c){ this.code = c; try { c ? localStorage.setItem(CODE_KEY, c) : localStorage.removeItem(CODE_KEY); } catch(e){} },
  async fetchAll(code){
    const r = await fetch(this.url(code || this.code), {cache:'no-store'});
    const j = await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(j.error || 'Cloud save is unavailable.');
    return j.players || [];
  },
  async push(p, keepalive){
    if(!p || !this.code || !this.usable) return;
    this.status = 'saving'; paintCloud();
    try {
      const r = await fetch(this.url(this.code, p.id), {method:'PUT', headers:{'content-type':'application/json'}, body:JSON.stringify(p), keepalive:!!keepalive});
      const j = await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(j.error || 'Cloud save failed.');
      this.status = 'ok'; this.lastSync = Date.now(); this.error = '';
    } catch(e){ this.status = 'error'; this.error = e.message; }
    paintCloud();
  },
  queue(id){
    if(!this.code || !this.usable) return;
    clearTimeout(this.timers[id]);
    this.timers[id] = setTimeout(() => { delete this.timers[id]; this.push(FAM.players.find(p=>p.id===id)); }, 4000);
  },
  flush(){ return Promise.all(Object.keys(this.timers).map(id => { clearTimeout(this.timers[id]); delete this.timers[id]; return this.push(FAM.players.find(p=>p.id===id), true); })); },
  async family(code){
    const r = await fetch('/api/family?code=' + encodeURIComponent(code || this.code), {cache:'no-store'});
    const j = await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(j.error || 'Cloud save is unavailable.');
    return j;
  },
  async setEmail(email, code){
    const r = await fetch('/api/family?code=' + encodeURIComponent(code || this.code), {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({email})});
    const j = await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(j.error || 'Could not save the email.');
    this.email = j.email; return j.email;
  },
  // Merge player by player: whichever copy of each player is newer wins; local-only players get uploaded.
  async sync(){
    if(!this.code || !this.usable) return;
    this.status = 'saving'; paintCloud();
    try {
      const remote = await this.fetchAll();
      const busy = view==='game' || view==='post' || view==='train' || view==='shark';
      const toPush = [];
      remote.forEach(rp => {
        const lp = FAM.players.find(p => p.id===rp.id);
        if(!lp){ if(!rp.deleted) rp.save = normalize(rp.save); FAM.players.push(rp); return; }
        if((rp.updated||0) > (lp.updated||0)){
          if(lp===ME && busy) return;           // don't swap a save out from under a game in progress
          Object.assign(lp, rp); if(!lp.deleted) lp.save = normalize(rp.save);
          if(lp===ME) S = lp.save;
        } else if((rp.updated||0) < (lp.updated||0)) toPush.push(lp);
      });
      FAM.players.forEach(lp => { if(!remote.some(rp => rp.id===lp.id)) toPush.push(lp); });
      if(ME && ME.deleted) setMe('');
      saveLocal();
      for(const p of toPush) await this.push(p);
      this.status = 'ok'; this.lastSync = Date.now(); this.error = '';
      try { this.email = (await this.family()).email; } catch(e){}
      if(!busy) render();
    } catch(e){ this.status = 'error'; this.error = e.message; }
    paintCloud();
  },
  // Short and easy to type on an iPad: a team name + 3 digits (comets-452), checked to be unused.
  async generate(){
    for(let i=0;i<5;i++){
      const code = `${pick(MASCOTS).toLowerCase()}-${rnd(100,999)}`;
      if(!(await this.fetchAll(code)).length && !(await this.family(code)).exists) return code;
    }
    throw new Error('Could not make a new code. Try again.');
  },
};
function cloudLine(){
  if(!Cloud.usable) return 'Cloud save works once the game is on its web address (not opened as a file).';
  if(!Cloud.code) return 'Not connected. Progress is saved on this device only.';
  const c = `Family code <b>${esc(Cloud.code)}</b>`;
  if(Cloud.status==='saving') return `${c} · saving…`;
  if(Cloud.status==='error') return `${c} · <span class="minus">${esc(Cloud.error)}</span>`;
  if(Cloud.status==='ok') return `${c} · saved to the cloud at ${new Date(Cloud.lastSync).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'})}`;
  return c;
}
function paintCloud(){ document.querySelectorAll('[data-cloud]').forEach(el => el.innerHTML = cloudLine()); }
document.addEventListener('visibilitychange', () => { if(document.visibilityState==='hidden') Cloud.flush(); });
window.addEventListener('pagehide', () => Cloud.flush());

/* ================= fact engine ================= */
const fkey = (a,b) => a<=b ? a+'x'+b : b+'x'+a;
function maxFactor(){ return S.settings.range==='auto' ? S.unlocked : +S.settings.range; }
function level(rec){
  if(!rec || !rec.n) return 0;
  const acc = rec.c/rec.n, avg = rec.c ? rec.t/rec.c : 99999;
  if(rec.n>=3 && acc>=.9 && avg<=3000) return 4;
  if(rec.n>=2 && acc>=.8) return 3;
  if(acc>=.5) return 2;
  return 1;
}
function weight(a,b){
  const r = S.facts[fkey(a,b)];
  let w;
  if(!r || !r.n) w = 2.5;
  else {
    const acc = r.c/r.n, avg = r.c ? r.t/r.c : 8000;
    w = .6 + (1-acc)*5 + (avg>5000?2.2:avg>3500?1.2:avg>2500?.5:0) + ((r.s||0)<2?.8:0);
  }
  const lo = Math.min(a,b), hi = Math.max(a,b);
  if(lo===1) w *= .15; else if(lo===2) w *= .6;
  if(hi===10 && lo!==10) w *= .5;
  return w;
}
let recent = [];
function pickFact(){
  const m = maxFactor(), pool = [];
  let total = 0;
  for(let a=1;a<=m;a++) for(let b=a;b<=m;b++){
    if(recent.includes(fkey(a,b))) continue;
    const w = weight(a,b); total += w; pool.push([a,b,w]);
  }
  let x = Math.random()*total, f = pool[pool.length-1];
  for(const p of pool){ x -= p[2]; if(x<=0){ f = p; break; } }
  recent.push(fkey(f[0],f[1])); if(recent.length>4) recent.shift();
  return chance(.5) ? {a:f[0],b:f[1]} : {a:f[1],b:f[0]};
}
function record(a,b,ok,ms){
  const k = fkey(a,b), r = S.facts[k] || (S.facts[k] = {n:0,c:0,t:0,s:0});
  r.n++; if(ok){ r.c++; r.t += Math.min(ms,15000); r.s = (r.s||0)+1; } else r.s = 0;
  S.stats.answered++; if(ok) S.stats.correct++;
  S.stats.days[today()] = (S.stats.days[today()]||0)+1;
}
function checkUnlock(){
  const share = pairs => pairs.filter(([a,b]) => level(S.facts[fkey(a,b)])>=3).length / pairs.length;
  const base = []; for(let a=2;a<=10;a++) for(let b=a;b<=10;b++) base.push([a,b]);
  const elevens = []; for(let a=2;a<=11;a++) elevens.push([a,11]);
  let u = S.unlocked;
  if(u<11 && share(base)>=.75) u = 11;
  if(u===11 && share(elevens)>=.75) u = 12;
  if(u>S.unlocked){ S.unlocked = u; save(); if(S.settings.range==='auto') toast(`New level unlocked: ×${u} facts are now in play!`); }
}

/* ================= sound ================= */
let AC;
function tone(freqs, dur=.12, type='triangle', gap=.07, vol=.14){
  if(!S.settings.sound) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const t0 = AC.currentTime;
    freqs.forEach((f,i)=>{ const o=AC.createOscillator(), g=AC.createGain(), s=t0+i*gap;
      o.type=type; o.frequency.value=f; g.gain.setValueAtTime(.0001,s); g.gain.exponentialRampToValueAtTime(vol,s+.01);
      g.gain.exponentialRampToValueAtTime(.0001,s+dur); o.connect(g); g.connect(AC.destination); o.start(s); o.stop(s+dur+.03); });
  }catch(e){}
}

const Pad = { on:false, ans:0, val:'', cb:null, box:'ansbox', answers:[], wait:0,
  start(ans, cb, box, also){ this.on=true; this.ans=ans; this.answers=[ans, ...(also||[])].map(String); this.val=''; this.cb=cb; this.box=box||'ansbox'; clearTimeout(this.wait); this.draw(); },
  press(k){
    if(!this.on) return;
    clearTimeout(this.wait);
    if(k==='del') this.val = this.val.slice(0,-1);
    else if(k==='ok'){ if(this.val) this.fire(); return; }
    else if(this.val.length<3 && !(this.val==='' && k==='0')) this.val += k;
    this.draw();
    if(k==='del') return;
    const v = this.val, exact = this.answers.includes(v), longer = this.answers.some(a => a.length > v.length && a.startsWith(v));
    if(exact && longer) this.wait = setTimeout(() => this.fire(), 800);
    else if(exact || (!longer && v.length >= Math.max(...this.answers.map(a=>a.length)))) this.fire();
  },
  fire(){ clearTimeout(this.wait); const v=this.val; this.on=false; this.cb && this.cb(v); },
  draw(){ const el = document.getElementById(this.box); if(!el) return; el.className='ansbox'+(this.val?'':' empty'); el.textContent = this.val || '?'; }
};

ACT.createCode = async (d, el) => {
  const email = (document.getElementById('famemail').value || '').trim();
  welcomeEmail = email;
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){ welcomeErr = 'Enter a parent email, like you@example.com.'; render(); return; }
  el.disabled = true;
  try {
    const code = await Cloud.generate();
    await Cloud.setEmail(email, code);        // saves the family record, so the code is taken from here on
    welcomeCode = code; welcomeErr = '';      // set before sync: sync re-renders, and this keeps the code on screen
    Cloud.setCode(code); setLocalOnly(false);
    await Cloud.sync();                       // uploads any players already on this device
  } catch(e){ welcomeCode = ''; welcomeErr = e.message; el.disabled = false; }
  render();
};
ACT.connect = async (d, el) => {
  const code = normalizeCode(document.getElementById('famcode').value);
  if(!/^[a-z0-9-]{4,40}$/.test(code)){ welcomeErr = 'Family codes look like comets-452.'; render(); return; }
  if(el) el.disabled = true;
  let remote;
  try { remote = await Cloud.fetchAll(code); } catch(e){ welcomeErr = e.message; render(); return; }
  if(!remote.some(p => !p.deleted)){ welcomeErr = `No family found for “${code}”. Check the spelling, or go back and start a new family.`; render(); return; }
  Cloud.setCode(code); setLocalOnly(false); welcomeMode = ''; welcomeErr = '';
  await Cloud.sync();
  if(!ME && livePlayers().length===1) setMe(livePlayers()[0].id);
  toast(`Joined! ${livePlayers().length} player${livePlayers().length===1?'':'s'} in this family.`);
  go(ME ? 'home' : 'players');
};
// Forgive how a code is typed: "Comets 452", "comets452" and "COMETS-452" all mean comets-452.
const normalizeCode = raw => { const c = String(raw||'').toLowerCase().replace(/[^a-z0-9]/g,''); const m = c.match(/^([a-z]+)(\d+)$/); return m ? `${m[1]}-${m[2]}` : c; };
ACT.copyCode = () => {

    const el = document.getElementById('codeText'); if(!el) return; const r = document.createRange(); r.selectNodeContents(el);
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); toast('Code selected. Copy it from here.');
  });
};

function setCall(text, cls){ const c = document.getElementById('call'); if(c){ c.textContent = text; c.className = 'call ' + (cls||''); } }
function moveBall(pct){ const b = document.getElementById('ball'); if(b) b.style.left = pct+'%'; }
function nextPlay(){
  if(view!=='game') return;
  if(G.i >= G.plays.length) return endGame();
  const play = G.plays[G.i];
  document.getElementById('per').textContent = G.sp.per(play.per);
  document.getElementById('pn').textContent = `Play ${G.i+1} of ${G.plays.length}`;
  const chip = document.getElementById('sideChip');
  chip.className = 'chip ' + (play.side==='O'?'o':'d');
  chip.textContent = play.side==='O' ? 'Offense · answer to score' : 'Defense · answer to stop them';
  moveBall(50);
  // A missed fact comes back a few plays later so he gets another shot at it.
  const due = G.retry.findIndex(r => r.due <= G.i);
  const {a,b} = due >= 0 ? G.retry.splice(due,1)[0] : pickFact();
  const isRetry = due >= 0;
  const limit = clockSecs()*1000, fastMs = limit*.4, bar = document.getElementById('tbar');
  G.q = {a, b, ans:a*b, t0:performance.now(), side:play.side, limit, retry:isRetry};
  document.getElementById('q').innerHTML = `${a} <small>×</small> ${b}`;
  document.getElementById('clock').textContent = `⏱ ${clockSecs()}s`;
  Pad.start(a*b, v => answer(v, false));
  cancelAnimationFrame(raf);
  const tick = () => {
    if(!G.q || G.q.done) return;
    const el = performance.now() - G.q.t0, frac = Math.max(0, 1 - el/limit);
    bar.style.transform = `scaleX(${frac})`;
    bar.style.background = el<=fastMs ? 'var(--good)' : frac>.25 ? 'var(--amber)' : 'var(--bad)';
    if(el >= limit){ Pad.on = false; answer('', true); return; }
    raf = requestAnimationFrame(tick);
  };
  raf = requestAnimationFrame(tick);
}
function answer(v, timedOut){
  const q = G.q; if(!q || q.done) return; q.done = true; cancelAnimationFrame(raf);
  const ms = performance.now() - q.t0, limit = q.limit;
  const ok = !timedOut && +v === q.ans && ms <= limit;
  const tier = ok ? (ms <= limit*.4 ? 'fast' : 'good') : 'miss';
  record(q.a, q.b, ok, ms);
  if(!ok) G.missed.push([q.a, q.b]);
  const f = G.f;
  const res = q.side==='O' ? G.sp.O(tier, .12*f.up.off) : G.sp.D(tier, Math.max(.08, LEAGUES[f.league].p - .1*f.up.def));
  const us = res.us||0, them = res.them||0;
  G.us += us; G.them += them;
  if(ok){ G.correct++; if(tier==='fast') G.fast++; G.streak++; G.best = Math.max(G.best, G.streak); }
  else G.streak = 0;
  S.stats.bestStreak = Math.max(S.stats.bestStreak, G.best);
  const box = document.getElementById('ansbox');
  if(ok){ box.className = 'ansbox right'; box.textContent = (tier==='fast'?'⚡ ':'✓ ') + q.ans; }
  else { box.className = 'ansbox wrong'; box.textContent = timedOut ? `Time! ${q.a} × ${q.b} = ${q.ans}` : `${q.a} × ${q.b} = ${q.ans}`; }
  if(us){ const e = document.getElementById('usSc'); e.textContent = G.us; e.classList.remove('bump'); void e.offsetWidth; e.classList.add('bump'); }
  if(them){ const e = document.getElementById('themSc'); e.textContent = G.them; e.classList.remove('bump'); void e.offsetWidth; e.classList.add('bump'); }
  if(q.side==='O') moveBall(us ? 91 : ok ? 72 : 42); else moveBall(them ? 9 : ok ? 58 : 28);
  const prefix = (ok && q.retry ? 'LOCKED IN! ' : '') + (tier==='fast' ? 'FAST! ' : '');
  setCall(prefix + res.text, us || (q.side==='D' && !them) ? 'good' : (them || tier==='miss') ? 'bad' : '');
  if(res.big && q.side==='O' && us){ bigBanner(res.big); SFX.score(); }
  else if(res.big && tier==='fast'){ bigBanner(res.big); SFX.fast(); }
  else if(tier==='fast') SFX.fast(); else if(ok) SFX.good(); else SFX.bad();
  const st = document.getElementById('streak');
  st.textContent = G.streak>=3 ? `🔥 ${G.streak} in a row` : '';
  if(ok && G.streak>0 && G.streak%5===0){ G.bonus += 5; toast(`${G.streak} in a row! +$5M hot-streak bonus`); }
  if(S.settings.timer==='auto'){
    if(ok){ G.run++; if(G.run>=3 && S.pace<PACE.length-1){ S.pace++; G.run = 0; G.miss = 0; toast(`You're heating up! Clock is now ${PACE[S.pace]} seconds.`); } }
    else { G.run = 0; G.miss++; if(G.miss>=2 && S.pace>0){ S.pace--; G.run = 0; G.miss = 0; toast(`Clock slowed to ${PACE[S.pace]} seconds. You've got this!`); } }
  }
  G.i++;
  if(tier==='miss'){
    G.retry.push({a:q.a, b:q.b, due:G.i+4});
    setTimeout(() => lockIn(q.a, q.b, () => setTimeout(nextPlay, 500)), 500);
  } else setTimeout(nextPlay, res.big ? 1600 : 1100);
}

// After a miss: pause the game, show the fact slowly, then have him type it himself.
// Browsers default to their most robotic voice. Rank what's installed and use the most natural English one.
// Premium/Enhanced voices (downloadable in iPad and Mac settings) and Chrome's Google voices sound far better.
const VOICE_KEY = 'franchise-tycoon.voice';
const ROBOTIC = /\b(Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Deranged|Good News|Hysterical|Jester|Organ|Pipe Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Fred|Junior|Ralph|Kathy|Eddy|Flo|Grandma|Grandpa|Reed|Rocko|Sandy|Shelley)\b/i;
const Voice = {
  all(){ try { return (window.speechSynthesis ? speechSynthesis.getVoices() : []).filter(v => /^en/i.test(v.lang)); } catch(e){ return []; } },
  score(v){
    let sc = 0;
    if(ROBOTIC.test(v.name)) sc -= 100;
    if(/premium/i.test(v.name)) sc += 60;
    if(/enhanced|natural|neural/i.test(v.name)) sc += 45;
    if(/google/i.test(v.name)) sc += 30;
    if(/\b(Ava|Zoe|Samantha|Allison|Evan|Nathan|Tom|Susan|Karen|Daniel|Serena|Jamie|Nicky|Aaron)\b/.test(v.name)) sc += 15;
    if(/en[-_]US/i.test(v.lang)) sc += 5;
    return sc;
  },
  ranked(){ return this.all().sort((a,b) => this.score(b) - this.score(a)); },
  saved(){ try { return localStorage.getItem(VOICE_KEY) || ''; } catch(e){ return ''; } },
  current(){ const vs = this.all(), want = this.saved(); return vs.find(v => v.voiceURI===want) || this.ranked()[0] || null; },
  set(uri){ try { uri ? localStorage.setItem(VOICE_KEY, uri) : localStorage.removeItem(VOICE_KEY); } catch(e){} },
};
try { if(window.speechSynthesis) speechSynthesis.onvoiceschanged = () => { if(view==='coach') render(); }; } catch(e){}
function say(text, force){
  if((!S.settings.sound && !force) || !window.speechSynthesis) return;
  try {
    const u = new SpeechSynthesisUtterance(text), v = Voice.current();
    if(v){ u.voice = v; u.lang = v.lang; }
    u.rate = .9; speechSynthesis.speak(u);
  } catch(e){}
}
function lockIn(a, b, done){
  if(view!=='game') return;
  const ans = a*b, el = document.createElement('div');
  el.className = 'lockin';
  el.innerHTML = `<div class="li-card" role="dialog" aria-modal="true" aria-label="Learn this fact">
    <div class="eyebrow">Let's lock this one in</div>
    <div class="li-fact tnum"><span class="li-q">${a} × ${b} =</span><span class="li-ans" id="liAns">${ans}</span></div>
    <div class="li-type">
      <div style="font-weight:700;font-size:19px">Now you type it</div>
      <div class="ansbox empty" id="liBox">?</div>
      ${padHTML()}
    </div></div>`;
  document.body.appendChild(el);
  tone([392,523],.3,'sine',.25,.08);
  say(`${a} times ${b}`);
  let revealed = false, closed = false;
  const reveal = () => {
    if(revealed || closed) return; revealed = true;
    const s = document.getElementById('liAns'); if(s) s.classList.add('show');
    say(String(ans)); tone([523,659,784],.35,'sine',.12,.08);
  };
  setTimeout(reveal, 1200);
  // The keypad takes input right away; typing it correctly before the reveal just shows the answer and moves on.
  const ask = () => Pad.start(ans, v => {
    const box = document.getElementById('liBox');
    if(+v === ans){
      reveal(); closed = true;
      box.className = 'ansbox right'; box.textContent = '✓ ' + ans; SFX.good();
      setTimeout(() => { el.remove(); done(); }, 700);
    } else {
      box.className = 'ansbox wrong shake'; box.textContent = v;
      setTimeout(ask, 350);
    }
  }, 'liBox');
  ask();
}

function endGame(){
  const f = G.f, L = LEAGUES[f.league];
  const r = G.us>G.them ? 'W' : G.us<G.them ? 'L' : 'T';
  f.games++; if(r==='W'){ f.w++; f.lw++; } else if(r==='L') f.l++; else f.t++;
  const lines = [];
  // Every game earns game-day revenue; winning adds extra merch and sponsor money.
  lines.push(['Game-day revenue (tickets, TV, food)', L.gate]);

  if(r==='T') lines.push(['Tie bonus', Math.round(L.win/2)]);
  if(f.up.stad) lines.push([`Stadium expansion (level ${f.up.stad})`, 10*f.up.stad]);
  if(G.bonus) lines.push(['Hot-streak bonuses', G.bonus]);
  f.deals.forEach(d=>{ lines.push([d.kind==='loan' ? `Payment to ${d.shark}` : `Payout from ${d.shark}`, d.kind==='loan' ? -d.per : d.per]); d.left--; });

    if(f.league < 3){ f.trophies.push({name:`${L.name} Champs`}); promo = `Promoted to the ${LEAGUES[f.league+1].name}!`; f.league++; }
    else { f.trophies.push({name:'Legends Champions', gold:true}); promo = 'LEGENDS CHAMPIONS!'; }
  }
  if(!f.shark && f.games % 3 === 0) f.shark = makeShark(f);
  if(r==='L'){ f.needsTraining = true; f.trainFact = coachPick(G.missed); }
  save(); checkUnlock();
  const qs = [0,1].map(()=>{ let f = pickFact(), tries = 0; while(Math.min(f.a,f.b) < 2 && tries++ < 20) f = pickFact(); const {a,b} = f; const lo=Math.min(a,b), hi=Math.max(a,b); return {a:hi>=3?lo:a, b:hi>=3?hi:b, tpl:pick(BIZ)}; });
  P = {r, us:G.us, them:G.them, lines, promo, qs, qi:0, biz:[], fr:f.id};

// Each strategy breaks "x × n" into steps he already knows. steps(x) -> [[prompt, value], ...]
const STRATS = {
  one:   {n:1,  name:'Mirror',          school:'Identity property: 1 group of anything is itself.', tip:'Anything times 1 stays exactly the same.', steps:x=>[[`${x} × 1 stays ${x}`, x]]},
  ten:   {n:10, name:'Add a Zero',      school:'Place value: times 10 moves every digit one place left.', tip:'Times 10? Just put a zero on the end.', steps:x=>[[`${x} with a zero on the end`, 10*x]]},
  two:   {n:2,  name:'Doubles',         school:'Doubles.', tip:'Times 2 means double it: add the number to itself.', steps:x=>[[`Double ${x}\u2003(${x} + ${x})`, 2*x]]},
  five:  {n:5,  name:'Ten Then Half',   school:'Half of ×10, or skip-count by 5s.', tip:'Times 10 is easy. Times 5 is exactly half of that.', alt:'fiveHalf', steps:x=>[[`${x} × 10`, 10*x],[`Half of ${10*x}`, 5*x]]},
  // The other way to do ×5, for kids who find halving 70 harder than halving 7. Two fives make a ten,
  // so pair up the groups of 5: each pair is 10. An odd number leaves one group of 5 over. No decimals.
  fiveHalf:{n:5, name:'Half Then Ten', school:'Two fives make a ten: halve the other number, then ×10.', alt:'five',
          tip:'Two fives make a ten. Pair up the groups of 5, and each pair is 10. Odd number? One group of 5 is left over, so add it at the end.',
          steps:x=> x%2===0 ? [[`Pair up the ${x} groups: how many pairs?`, x/2], [`${x/2} pairs = ${x/2} tens`, 5*x]]
                            : [[`Pair up the ${x} groups: how many pairs?`, (x-1)/2], [`${(x-1)/2} pairs = ${(x-1)/2} tens`, 5*(x-1)], [`${5*(x-1)} + the leftover 5`, 5*x]]},
  nine:  {n:9,  name:'Ten Minus One',   school:'Use a known fact: ×10, then subtract one group (distributive property).', tip:'Do times 10, then take away one group.', steps:x=>[[`${x} × 10`, 10*x],[`${10*x} − ${x}`, 9*x]],
          bonus:'Check your answer: for 9 × 2 up to 9 × 10, the two digits always add up to 9. (9 × 7 = 63, and 6 + 3 = 9.)'},
  four:  {n:4,  name:'Double Double',   school:'Double a double.', tip:'Times 4: double it, then double it again.', steps:x=>[[`Double ${x}`, 2*x],[`Double ${2*x}`, 4*x]]},
  eleven:{n:11, name:'Ten Plus One',    school:'Break apart 11 into 10 + 1 (distributive property).', tip:'Do times 10, then add one more group.', steps:x=>[[`${x} × 10`, 10*x],[`${10*x} + ${x}`, 11*x]],
          bonus:'Shortcut: 11 times a single digit just repeats it. 11 × 7 = 77.'},
  twelve:{n:12, name:'Ten Plus Two',    school:'Break apart 12 into 10 + 2 (distributive property).', tip:'Do times 10 and times 2, then add them together.', steps:x=>[[`${x} × 10`, 10*x],[`${x} × 2`, 2*x],[`${10*x} + ${2*x}`, 12*x]]},
  three: {n:3,  name:'Double Plus One', school:'Break apart 3 into 2 + 1: a double plus one more group.', tip:'Double it, then add one more group.', steps:x=>[[`Double ${x}`, 2*x],[`${2*x} + ${x}`, 3*x]]},
  six:   {n:6,  name:'Five Plus One',   school:'Break apart 6 into 5 + 1 (distributive property).', tip:'Do times 5, then add one more group.', steps:x=>[[`${x} × 5`, 5*x],[`${5*x} + ${x}`, 6*x]]},
  eight: {n:8,  name:'Triple Double',   school:'Double a double a double.', tip:'Times 8: double it three times in a row.', steps:x=>[[`Double ${x}`, 2*x],[`Double ${2*x}`, 4*x],[`Double ${4*x}`, 8*x]]},
  seven: {n:7,  name:'Five Plus Two',   school:'Break apart 7 into 5 + 2 (distributive property).', tip:'Do times 5 and times 2, then add them together.', steps:x=>[[`${x} × 5`, 5*x],[`${x} × 2`, 2*x],[`${5*x} + ${2*x}`, 7*x]]},
};
// Easiest strategy wins when a fact could use two (7 × 9 uses Ten Minus One, not Five Plus Two).
const STRAT_ORDER = ['one','ten','two','five','nine','four','eleven','twelve','three','six','eight','seven'];
const PLAYBOOK = ['two','ten','five','nine','four','eight','three','six','seven','eleven','twelve'];
function stratFor(a,b){ for(const id of STRAT_ORDER){ const n = STRATS[id].n; if(a===n) return {id, x:b}; if(b===n) return {id, x:a}; } }
function coachPick(missed){
  const pool = (missed||[]).filter(([a,b]) => a>1 && b>1);
  if(pool.length){
    const cnt = {}; pool.forEach(([a,b]) => { const k = fkey(a,b); cnt[k] = (cnt[k]||0)+1; });
    return pool.reduce((m,p) => cnt[fkey(p[0],p[1])] > cnt[fkey(m[0],m[1])] ? p : m, pool[0]);
  }
  let best = [7,8], bw = -1;  // lost without a miss: work on his weakest fact
  for(let a=2;a<=maxFactor();a++) for(let b=a;b<=maxFactor();b++){ const w = weight(a,b); if(w>bw){ bw=w; best=[b,a]; } }
  return best;
}
const shuffle = arr => { const a = arr.slice(); for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; };

/* ---------- foundations: every strategy is built on three core tables (×2, ×5, ×10) ---------- */
const ANCHORS = ['ten','two','five'];
const UNLOCKS = {ten:'×9, ×11 and ×5', two:'×4, ×8 and ×3', five:'×6 and ×7'};
// A core fact only helps as a step if it's automatic: right AND quick (under 5s on average).
function anchorState(id){
  const n = STRATS[id].n, xs = Array.from({length:Math.min(10,maxFactor())-1}, (_,i)=>i+2).filter(x => x!==n);
  const recs = xs.map(x => S.facts[fkey(n,x)]).filter(r => r && r.n);
  if(recs.length < Math.ceil(xs.length*.5)) return 'unknown';
  const ok = recs.filter(r => r.c/r.n >= .8 && r.c && r.t/r.c <= 5000).length;
  return ok/recs.length >= .75 ? 'solid' : 'weak';
}
const STATE_LABEL = {solid:'Solid', weak:'Needs work', unknown:'Not tested yet'};
const stateCls = st => st==='solid' ? 'plus' : st==='weak' ? 'minus' : 'muted';
const foundationsSolid = () => ANCHORS.every(id => anchorState(id)==='solid');

// Training Camp: core tables first. Until ×2, ×5 and ×10 are all solid, a session checks the ones
// that aren't and drills one of them. After that, sessions teach the strategy for the missed fact.
let FD = null;
function startCamp(required, fact){
  if(foundationsSolid()){ const [a,b] = fact; return startTraining(stratFor(a,b).id, a, b, required); }
  FD = {required, fact}; go('found');
}
function vFound(){
  const f = frById(cur);
  return `
  <div class="gamebar"><button class="link" data-act="open" data-id="${f.id}">${FD.required ? '← Front office (training still needed)' : '← Back to front office'}</button></div>
  <div class="stack" style="max-width:760px">
    <div><div class="eyebrow">Training Camp</div><h1 class="display" style="font-size:clamp(48px,9vw,72px)">Foundations first</h1>
      <p style="margin:6px 0 0;font-size:19px;max-width:60ch">Every multiplication strategy is built on three core tables. Once <b>×2, ×5 and ×10</b> are automatic, you can work out any fact up to 12 × 12.</p></div>
    <div class="plays" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">${ANCHORS.map(id => { const st = anchorState(id);
      return `<button class="play" data-act="coreInfo" data-id="${id}"><span class="x">×${STRATS[id].n}</span><h3 class="display">${STRATS[id].name}</h3>
        <span class="muted" style="font-size:14px">Base for ${UNLOCKS[id]}</span><b class="${stateCls(st)}">${STATE_LABEL[st]}</b>
        <span style="font-size:14px;font-weight:600;color:var(--amber)">How it works →</span></button>`; }).join('')}</div>
    <p class="muted" style="margin:0">Right and under 5 seconds counts as solid. The strategies unlock once all three are solid.</p>
    <div><button class="btn primary big" data-act="foundStart">Start the check</button></div>
  </div>`;
}
// Tapping a core table explains it: the play, a worked example, and how later tables build on it.
const CORE_BUILDS = {
  ten: 'Nine is one less than ten: 9 × 7 = 10 × 7 − 7 = 63.',
  two: 'Four is a double double: 4 × 7 = double 14 = 28. Eight doubles one more time: 56.',
  five:'Six is five plus one more: 6 × 7 = 5 × 7 + 7 = 42.',
};
ACT.coreInfo = d => {
  const s = STRATS[d.id], n = s.n, x = 7, st = anchorState(d.id);
  const stepList = (sid, ex = x) => STRATS[sid].steps(ex).map((stp,i,arr) => `<div class="step ${i===arr.length-1?'last-step':''}"><span class="n">${i+1}</span><span class="p">${esc(stp[0])}</span><span class="v tnum">${stp[1]}</span></div>`).join('');
  const steps = s.alt
    ? [s.alt, d.id].map((sid,k) => `<b>Way ${k+1}: ${esc(STRATS[sid].name)}</b><span class="muted" style="font-size:15px;margin-top:-4px">${esc(STRATS[sid].tip)}</span>${sid==='fiveHalf'
        ? [8, 7].map(ex => `<div class="stack" style="gap:8px;margin-top:6px"><b style="font-size:17px">${ex%2 ? 'Odd' : 'Even'}: ${ex} × 5 = <span style="color:var(--amber)">${ex*5}</span></b>${fivePairs(ex)}${stepList(sid, ex)}</div>`).join('')
        : stepList(sid)}`).join('')
    : stepList(d.id);
  const el = document.createElement('div');
  el.className = 'lockin'; el.id = 'coreModal';
  el.innerHTML = `<div class="li-card" role="dialog" aria-modal="true" aria-label="${esc(s.name)}" style="text-align:left">
    <div class="eyebrow">Core table · ×${n}</div>
    <h2 class="display" style="font-size:52px">${esc(s.alt ? 'Times Five' : s.name)}</h2>
    ${s.alt ? `<p style="margin:0;font-size:19px">Two ways to do it. Try both and use the one that clicks.</p>` : `<p style="margin:0;font-size:19px">${esc(s.tip)}</p>`}
    <div class="bigfact tnum" style="font-size:72px">${x} × ${n} = <span style="color:var(--amber)">${x*n}</span></div>
    <div class="steps">${steps}</div>
    <p style="margin:0"><b>Why it matters:</b> it's the base for ${UNLOCKS[d.id]}. ${CORE_BUILDS[d.id]}</p>
    <p style="margin:0" class="muted"><b style="color:var(--text)">In class you might hear:</b> ${s.school}</p>
    <p style="margin:0">Your ×${n}s: <b class="${stateCls(st)}">${STATE_LABEL[st]}</b></p>
    <div class="row"><button class="btn primary" data-act="corePractice" data-id="${d.id}">Practice ×${n} now</button><button class="btn" data-act="coreClose">Got it</button></div>
  </div>`;
  el.addEventListener('click', e => { if(e.target===el) el.remove(); });
  document.body.appendChild(el);
  el.scrollTop = 0;
  el.querySelector('[data-act=coreClose]').focus({preventScroll:true});
};
ACT.coreClose = () => { const m = document.getElementById('coreModal'); if(m) m.remove(); };
ACT.corePractice = d => { ACT.coreClose(); const n = STRATS[d.id].n; startTraining(d.id, rnd(3, 9), n, FD ? FD.required : false, true); };
document.addEventListener('keydown', e => { if(e.key==='Escape') ACT.coreClose(); });
ACT.foundStart = () => startTryout(ANCHORS.filter(id => anchorState(id)!=='solid'), afterCheck);
// After the check: drill the first core table that isn't solid (one per session), using the missed fact's number when it fits.
function afterCheck(){
  const {required, fact:[a,b]} = FD;
  const weak = ANCHORS.find(id => anchorState(id)!=='solid');
  if(!weak){ toast('Foundations solid! The strategies are unlocked.'); return startTraining(stratFor(a,b).id, a, b, required); }
  const n = STRATS[weak].n, x = [a,b].find(v => v!==n && v>=2 && v<=10) || rnd(3,9);
  startTraining(weak, x, n, required, true);
}
function toReps(){ T.stage = 'guided'; go('train'); armTrain(); }

let TO = null;  // tryout in progress
function startTryout(anchors, after){
  const qs = [];
  anchors.forEach(id => { const n = STRATS[id].n;
    shuffle(Array.from({length:8}, (_,i)=>i+2).filter(x=>x!==n)).slice(0,4).forEach(x => qs.push(chance(.5) ? {id, a:x, b:n} : {id, a:n, b:x})); });
  TO = {anchors, qs, i:0, res:{}, after, fb:''};
  anchors.forEach(id => TO.res[id] = {right:0, total:0, ms:0});
  go('tryout'); armTryout();
}
function vTryout(){
  const f = frById(cur), done = TO.i >= TO.qs.length;
  const head = `<div class="gamebar"><button class="link" data-act="open" data-id="${f.id}">← Back to front office</button></div>
    <div><div class="eyebrow">Training Camp</div><h1 class="display" style="font-size:clamp(48px,9vw,72px)">Core tables check</h1>
    <p style="margin:6px 0 0;font-size:19px;max-width:60ch">${TO.anchors.map(id=>'×'+STRATS[id].n).join(', ')}: the base for every strategy. Show the coach they're automatic.</p></div>`;
  if(done){
    const rows = TO.anchors.map(id => { const r = TO.res[id], st = anchorState(id);
      return `<div class="deal"><span><b>×${STRATS[id].n}</b> · ${STRATS[id].name}</span><span class="${st==='solid'?'plus':'minus'}">${r.right} of ${r.total} · ${(r.ms/Math.max(1,r.total)/1000).toFixed(1)}s avg · ${STATE_LABEL[st]}</span></div>`; }).join('');
    return `<div class="stack" style="max-width:760px">${head}<section class="panel stack"><div class="eyebrow">Core tables results</div><div>${rows}</div>
      <p style="margin:0" class="muted">Right <i>and</i> quick (under 5 seconds) counts as solid. ${TO.after ? 'Next, the coach drills one that needs work.' : 'Training Camp drills anything that needs work, one table per session.'}</p>
      <div><button class="btn primary big" data-act="tryoutDone">Continue</button></div></section></div>`;
  }
  const q = TO.qs[TO.i];
  return `<div class="stack" style="max-width:760px">${head}<section class="panel stack">
    <div class="progress">${TO.qs.map((_,i)=>`<i class="${i<TO.i?'on':''}"></i>`).join('')}</div>
    <div class="eyebrow">No clock, but quick answers count</div>
    <div class="bigfact tnum">${q.a} × ${q.b}</div>
    <div class="ansbox empty" id="ansbox">?</div>
    <div id="tfb" style="font-weight:700;min-height:24px">${TO.fb}</div>
    ${padHTML()}</section></div>`;
}
function armTryout(){
  if(view!=='tryout' || !TO || TO.i >= TO.qs.length) return;
  const q = TO.qs[TO.i], ans = q.a*q.b, t0 = performance.now();
  Pad.start(ans, v => {
    const ok = +v === ans, ms = performance.now()-t0, r = TO.res[q.id], box = document.getElementById('ansbox');
    record(q.a, q.b, ok, ms); r.total++; r.ms += Math.min(ms, 15000); if(ok) r.right++;
    box.className = 'ansbox ' + (ok ? 'right' : 'wrong'); box.textContent = ok ? '✓ ' + ans : `${q.a} × ${q.b} = ${ans}`;
    ok ? SFX.good() : SFX.bad();
    TO.i++;
    if(TO.i >= TO.qs.length) save();
    setTimeout(() => { if(view!=='tryout') return; TO.fb = ''; render(); armTryout(); }, ok ? 600 : 1800);
  });
}
ACT.tryoutDone = () => { const after = TO.after; TO = null; after ? after() : go('playbook'); };
ACT.tryouts = () => startTryout(ANCHORS, null);

let T = null;
function startTraining(sid, a, b, required, foundation){
  sid = (S.ways && S.ways[sid]) || DEFAULT_WAY[sid] || sid;   // the way this player picked, else the default (×5: Half Then Ten)
  const n = STRATS[sid].n, x0 = a===n ? b : a;
  const pool = shuffle(Array.from({length:Math.min(maxFactor(),12)-2+1}, (_,i)=>i+2).filter(x => x!==x0));
  const take = k => { const out = []; for(let i=0;i<k;i++) out.push(pool.length ? pool.shift() : rnd(2,9)); return out; };
  T = {sid, a, b, x0, required, foundation: !!foundation, stage:'film', shown:1, guided:take(3), gi:0, si:0, done:[], scrim:[...take(3), x0], ci:0, right:0, fb:'', fbCls:''};
  go('train'); armTrain();
}
// Optional training any time: same order (core tables first), coach picks his weakest fact, no bonus.
ACT.trainOptional = () => startCamp(false, coachPick([]));
ACT.train = () => { const f = frById(cur); startCamp(true, f.trainFact || coachPick([])); };
ACT.playbook = () => go('playbook');
ACT.drill = d => {
  const core = ANCHORS.includes(d.id);
  if(!core && !foundationsSolid()){ toast('This play unlocks when ×2, ×5 and ×10 are all solid.'); return; }
  const n = STRATS[d.id].n, x = rnd(3, Math.min(9, maxFactor())); startTraining(d.id, x, n, false, core);
};
ACT.nextStep = () => { T.shown++; render(); };
const DEFAULT_WAY = {five:'fiveHalf'};
// The base id a way belongs to ('fiveHalf' -> 'five'), which is what S.ways is keyed by.
// x × 5 as x groups of five dots, wrapped in pairs (each pair = 10), with an odd group left over as +5.
function fivePairs(x){
  const g = '<div class="g5"><i></i><i></i><i></i><i></i><i></i></div>', tens = Math.floor(x/2), odd = x % 2;
  return `<div class="stack" style="gap:8px"><div class="pairs" role="img" aria-label="${x} groups of 5, paired into ${tens} tens${odd?' with 1 group left over':''}">
      ${Array.from({length:tens}, () => `<div class="pair">${g}${g}<b><span class="b1">5</span> + <span class="b2">5</span> = 10</b></div>`).join('')}
      ${odd ? `<div class="pair left">${g}<b>+5</b></div>` : ''}</div>
    <div class="muted" style="text-align:center;font-weight:600">${x} groups of 5 → ${tens} pair${tens===1?'':'s'}${odd ? ' + 1 left over' : ''} → ${odd ? `${tens*10} + 5` : `${tens} ten${tens===1?'':'s'}`} = ${x*5}</div></div>`;
}
const baseWay = id => STRATS[id].alt && !STRAT_ORDER.includes(id) ? STRATS[id].alt : id;
ACT.pickWay = d => { S.ways = S.ways || {}; S.ways[baseWay(d.v)] = d.v; save(); T.sid = d.v; T.shown = 1; render(); };
ACT.toGuided = () => toReps();
ACT.finishTraining = () => { go('hub'); };

function vPlaybook(){
  const f = frById(cur);
  return `
  <div class="gamebar"><button class="link" data-act="open" data-id="${f.id}">← Back to front office</button></div>
  <div class="stack">
    <div><div class="eyebrow">Training Camp</div><h1 class="display" style="font-size:clamp(48px,9vw,72px)">The Playbook</h1>
      <p class="muted" style="margin:6px 0 0;max-width:60ch">Start with the three core tables. Every other play is built on them.</p></div>
    <h2 class="display" style="font-size:30px">Core tables</h2>
    <div class="plays">${ANCHORS.map(id => { const s = STRATS[id], st = anchorState(id); return `<button class="play" data-act="drill" data-id="${id}"><span class="x">×${s.n}</span><h3 class="display">${s.name}</h3><span>${s.tip}</span><b class="${stateCls(st)}">${STATE_LABEL[st]}</b></button>`; }).join('')}</div>
    <div><button class="btn" data-act="tryouts">Check my core tables</button></div>
