  </div>`;
}

function vTrain(){
  const f = frById(cur), s = STRATS[T.sid], n = s.n;
  const total = T.guided.length + T.scrim.length, doneCount = T.stage==='film' ? 0 : T.stage==='guided' ? T.gi : T.stage==='scrim' ? T.guided.length + T.ci : total;
  const bar = `<div class="progress">${Array.from({length:total},(_,i)=>`<i class="${i<doneCount?'on':''}"></i>`).join('')}</div>`;
  const stepRow = (i, p, v, cls) => `<div class="step ${cls||''}"><span class="n">${i+1}</span><span class="p">${esc(p)}</span><span class="v tnum">${v}</span></div>`;
  const head = `<div class="gamebar"><button class="link" data-act="open" data-id="${f.id}">${T.required?'← Front office (training still needed)':'← Back to front office'}</button></div>
    <div><div class="eyebrow">Training Camp · ×${n}</div><h1 class="display" style="font-size:clamp(48px,9vw,72px)">${s.name}</h1><p style="margin:6px 0 0;font-size:19px;max-width:60ch">${s.tip}</p></div>`;
  let body = '';

  if(T.stage==='film'){
    const steps = s.steps(T.x0), all = T.shown >= steps.length;
    body = `${T.foundation ? `<section class="traincard"><div><div class="display" style="font-size:28px">Foundations · ×${n}</div><div>×${n} is one of the three core tables every strategy is built on. Lock it in and the plays that use it get easy.</div></div></section>` : ''}
      <section class="panel stack"><div class="eyebrow">Film room · watch the play</div>
      ${s.alt ? `<div class="stack" style="gap:6px"><b>Two ways to run this play. Pick the one that clicks:</b>
        <div class="seg">${[STRATS[baseWay(T.sid)].alt, baseWay(T.sid)].map(id => `<button data-act="pickWay" data-v="${id}" aria-pressed="${T.sid===id}">${STRATS[id].name}</button>`).join('')}</div></div>` : ''}
      <div class="bigfact tnum">${T.a} × ${T.b}${all ? ` = <span style="color:var(--amber)">${T.a*T.b}</span>` : ''}</div>
      ${T.a!==T.b ? `<div class="muted" style="text-align:center;font-weight:600">Order doesn't matter: ${T.a} × ${T.b} is the same as ${T.b} × ${T.a}. (In class: turn-around facts.)</div>` : ''}
      ${T.sid==='fiveHalf' ? fivePairs(T.x0) : ''}
      <div class="steps">${steps.slice(0,T.shown).map((st,i)=>stepRow(i, st[0], st[1], i===steps.length-1?'last-step':'')).join('')}</div>
      ${all ? `<p style="margin:0" class="muted"><b style="color:var(--text)">In class you might hear:</b> ${s.school}</p>${s.bonus ? `<p style="margin:0" class="muted"><b style="color:var(--text)">Bonus tip:</b> ${s.bonus}</p>` : ''}<button class="btn primary big" data-act="toGuided">Your turn</button>`
            : `<button class="btn primary big" data-act="nextStep">Next step</button>`}
    </section>`;
  }
  else if(T.stage==='guided'){
    const x = T.guided[T.gi], steps = s.steps(x);
    body = `<section class="panel stack">${bar}<div class="eyebrow">Practice reps · ${T.gi+1} of ${T.guided.length} · run the play step by step</div>
      <div class="muted" style="font-weight:600;margin-top:-6px">Know the answer already? Just type it.</div>
      <div class="bigfact tnum">${x} × ${n}</div>
      <div class="steps">${steps.slice(0,T.si).map((st,i)=>stepRow(i, st[0], st[1])).join('')}
        <div class="step" style="border-color:var(--amber)"><span class="n">${T.si+1}</span><span class="p">${esc(steps[T.si][0])} = ?</span></div></div>
      <div class="ansbox empty" id="ansbox">?</div>
      <div id="tfb" class="${T.fbCls}" style="font-weight:700;min-height:24px">${T.fb}</div>
      ${padHTML()}</section>`;
  }
  else if(T.stage==='scrim'){
    const x = T.scrim[T.ci], flip = (T.ci % 2 === 1), last = T.ci === T.scrim.length-1;
    body = `<section class="panel stack">${bar}<div class="eyebrow">Scrimmage · ${T.ci+1} of ${T.scrim.length} · no clock, use the play in your head${last && !T.foundation ? ' · this is the one from the game!' : ''}</div>
      <div class="bigfact tnum">${flip ? `${n} × ${x}` : `${x} × ${n}`}</div>
      <div class="ansbox empty" id="ansbox">?</div>
      <div id="tfb" class="${T.fbCls}" style="font-weight:700;min-height:24px">${T.fb}</div>
      ${padHTML()}</section>`;
  }
  else {
    body = `<section class="panel stack" style="text-align:center">
      <div class="res display W" style="font-size:clamp(64px,12vw,110px)">Training complete</div>
      <p style="margin:0;font-size:19px">${T.right} of ${T.scrim.length} in the scrimmage. You just practiced <b>${s.name}</b> for ×${n} facts.</p>
      ${T.foundation ? `<p style="margin:0" class="muted">Core tables: ${ANCHORS.map(id => `×${STRATS[id].n} <b class="${stateCls(anchorState(id))}">${STATE_LABEL[anchorState(id)]}</b>`).join(' · ')}. ${foundationsSolid() ? 'All solid: the strategies are unlocked!' : 'The strategies unlock when all three are solid.'}</p>` : ''}
      ${T.required ? `<div class="display" style="font-size:36px;color:var(--good)">+$15M training bonus</div>` : ''}
      <div class="row" style="justify-content:center"><button class="btn primary big" data-act="finishTraining">${T.required ? 'Back to the front office' : 'Done'}</button></div></section>`;
  }
  return `<div class="stack" style="max-width:760px">${head}${body}</div>`;
}

function armTrain(){
  if(view!=='train' || !T) return;
  const s = STRATS[T.sid], n = s.n;
  const later = (ms) => setTimeout(() => { if(view!=='train') return; render(); T.fb=''; T.fbCls=''; armTrain(); }, ms);
  if(T.stage==='guided'){
    const x = T.guided[T.gi], steps = s.steps(x), val = steps[T.si][1], final = x*n;
    Pad.start(val, v => {
      const box = document.getElementById('ansbox');
      // Knowing the answer outright beats running the play: accept it at any step.
      if(+v === final && T.si < steps.length-1){
        box.className = 'ansbox right'; box.textContent = '✓ ' + final; SFX.fast();
        T.si = 0; T.gi++; T.fb = `You already know it! ${x} × ${n} = ${final}`; T.fbCls = 'plus';
        if(T.gi >= T.guided.length){ T.stage = 'scrim'; }
        return later(1400);
      }
      const ok = +v === val;
      box.className = 'ansbox ' + (ok ? 'right' : 'wrong'); box.textContent = ok ? '✓ ' + val : `It's ${val}`;
      ok ? SFX.good() : SFX.bad();
      T.si++;
      if(T.si >= steps.length){ T.si = 0; T.gi++; T.fb = `${x} × ${n} = ${final}`; T.fbCls = 'plus'; }
      if(T.gi >= T.guided.length){ T.stage = 'scrim'; T.fb = ''; T.fbCls = ''; }
      later(ok ? 700 : 1800);
    }, 'ansbox', [final]);
  }
  else if(T.stage==='scrim'){
    const x = T.scrim[T.ci], ans = x*n, t0 = performance.now();
    Pad.start(ans, v => {
      const ok = +v === ans, box = document.getElementById('ansbox');
      record(x, n, ok, performance.now()-t0);
      if(ok){ T.right++; box.className = 'ansbox right'; box.textContent = '✓ ' + ans; SFX.good(); }
      else {
        box.className = 'ansbox wrong'; box.textContent = `${x} × ${n} = ${ans}`; SFX.bad();
        document.getElementById('tfb').innerHTML = 'Run the play: ' + s.steps(x).map(st => `${esc(st[0])} = ${st[1]}`).join(' → ');
      }
      T.ci++;
      if(T.ci >= T.scrim.length){
        T.stage = 'done';
        const f = frById(cur);
        if(T.required && f.needsTraining){ f.needsTraining = false; f.trainFact = null; f.cash += 15; }
        save(); setTimeout(() => { if(view==='train'){ render(); SFX.score(); } }, ok ? 900 : 3500);
        return;
      }
      later(ok ? 900 : 3500);
    });
  }
}

/* ================= SHARK TANK ================= */
function makeShark(f){
  const s = pick(SHARKS), per = rnd(4, Math.min(12, maxFactor())), n = rnd(3, 9), total = per*n;
  const kind = chance(.6) ? 'loan' : 'invest';
  const amount = Math.round(total * (kind==='loan' ? .55 + Math.random()*.6 : .6 + Math.random()*.6));
  return {name:s.name, color:s.color, kind, per, n, amount, stage:'pitch'};
}
function vShark(){
  const f = frById(cur), s = f.shark;
  const pitch = s.kind==='loan'
    ? `“I like the ${esc(f.city)} ${esc(f.name)}. I'll give you <b>${money(s.amount)}</b> right now. In return, you pay me <b>${money(s.per)}</b> after each of your next <b>${s.n}</b> games.”`
    : `“Invest <b>${money(s.amount)}</b> in my sports drink company. I'll pay you back <b>${money(s.per)}</b> after each of your next <b>${s.n}</b> games.”`;
  const total = s.per*s.n;
  let body;
  if(s.stage==='pitch') body = `
    <div class="bizq">Before you decide, do the math. How much is <b>${s.n} games × ${money(s.per)}</b>?</div>
    <div class="ansbox empty" id="ansbox">?</div>
    <div class="muted" id="bizfb" style="font-weight:600;min-height:24px">No clock here. Answer in millions. Sharks respect a careful owner.</div>
    ${padHTML()}`;
  else {
    const loan = s.kind==='loan', diff = loan ? total - s.amount : total - s.amount;
    const verdict = loan
      ? (diff>0 ? `The shark makes <b>${money(diff)}</b> off this deal. Only take it if you need cash right now for an upgrade.` : diff<0 ? `You'd come out <b>${money(-diff)}</b> ahead. That's a sweet deal!` : `It's even. You get the money now and pay back the same amount.`)
      : (diff>0 ? `You'd make a <b>${money(diff)}</b> profit, but your money is tied up for ${s.n} games.` : diff<0 ? `You'd lose <b>${money(-diff)}</b> on this one.` : `You'd just get your own money back.`);
    const cant = !loan && f.cash < s.amount;
    body = `
      ${s.stage==='fixed' ? `<div class="muted" style="font-weight:600">Close! ${s.n} × ${money(s.per)} = ${money(total)}.</div>` : `<div style="font-weight:700;color:var(--good)">Right! ${s.n} × ${money(s.per)} = ${money(total)}.</div>`}
      <div class="cmp tnum">
        <div><span class="eyebrow">${loan?'You get now':'You pay now'}</span><b class="${loan?'plus':'minus'}">${money(s.amount)}</b></div>
        <div><span class="eyebrow">${loan?'You pay back':'You get back'}</span><b class="${loan?'minus':'plus'}">${money(total)}</b></div>
      </div>
      <p style="margin:0;font-size:18px">${verdict}</p>
      ${cant ? `<p class="minus" style="margin:0;font-weight:700">You only have ${money(f.cash)} in the bank, so you can't afford this one.</p>` : ''}
      <div class="row"><button class="btn primary big" data-act="deal" ${cant?'disabled':''}>Deal!</button><button class="btn big" data-act="nodeal">No deal</button></div>`;
  }
  return `
  <div class="gamebar"><button class="link" data-act="open" data-id="${f.id}">← Back to front office</button></div>
  <div class="stack" style="max-width:720px">
    <div class="row">${FIN}<div><div class="eyebrow">Shark Tank</div><h1 class="display" style="font-size:52px;color:${s.color}">${esc(s.name)}</h1></div></div>
    <p class="quote" style="margin:0">${pitch}</p>
    <section class="panel stack">${body}</section>
  </div>`;
}
ACT.shark = () => {
  go('shark');
  const f = frById(cur), s = f.shark;
  if(s.stage!=='pitch') return;
  Pad.start(s.per*s.n, v => {
    const ok = +v === s.per*s.n;
    record(s.per, s.n, ok, 6000);
    s.stage = ok ? 'decide' : 'fixed'; save();
    ok ? SFX.good() : SFX.bad();
    render();
  });
};
ACT.deal = () => {
  const f = frById(cur), s = f.shark;
  if(s.kind==='loan') f.cash += s.amount; else { if(f.cash < s.amount) return; f.cash -= s.amount; }
  f.deals.push({shark:s.name, kind:s.kind, per:s.per, left:s.n});
  f.shark = null; save(); SFX.cash();
  toast(`Deal! ${s.name} shakes your hand.`); go('hub');
};
ACT.nodeal = () => { const f = frById(cur); const n = f.shark.name; f.shark = null; save(); toast(`${n} swims away.`); go('hub'); };

/* ================= COACH'S OFFICE ================= */
const LV = [{c:'#243447',t:'Not seen yet'},{c:'#FF5A5F',t:'Needs work'},{c:'#F2994A',t:'Learning'},{c:'#F5D547',t:'Solid'},{c:'#3DDC84',t:'Mastered (fast)'}];
let coachSel = null;
function vCoach(){
  const m = maxFactor();
  const acc = S.stats.answered ? Math.round(S.stats.correct/S.stats.answered*100) : 0;
  const days = Object.keys(S.stats.days).length;
  const todayN = S.stats.days[today()] || 0;
  let head = '<tr><th></th>' + Array.from({length:12},(_,i)=>`<th>${i+1}</th>`).join('') + '</tr>', rows = '';
  for(let a=1;a<=12;a++){
    rows += `<tr><th>${a}</th>`;
    for(let b=1;b<=12;b++){ const lv = level(S.facts[fkey(a,b)]); rows += `<td><button class="cell ${a>m||b>m?'off':''}" style="background:${LV[lv].c}" data-act="cell" data-a="${a}" data-b="${b}" aria-label="${a} times ${b}: ${LV[lv].t}">${lv===1?'!':''}</button></td>`; }
    rows += '</tr>';
  }
  const trouble = Object.entries(S.facts).filter(([k,r])=>r.n>=2).map(([k,r])=>({k, score:(1-r.c/r.n)*3 + (r.c?r.t/r.c:9000)/3000}))
    .sort((x,y)=>y.score-x.score).slice(0,8).filter(x=>x.score>1.4);
  const sel = coachSel ? (()=>{ const r = S.facts[fkey(coachSel[0],coachSel[1])];
    return r&&r.n ? `<b>${coachSel[0]} × ${coachSel[1]} = ${coachSel[0]*coachSel[1]}</b>: ${r.c} of ${r.n} right${r.c?`, average ${(r.t/r.c/1000).toFixed(1)}s`:''}. ${LV[level(r)].t}.` : `<b>${coachSel[0]} × ${coachSel[1]}</b>: not seen yet.`; })() : 'Tap a square for details.';
  const seg = (act, cur, opts) => `<div class="seg">${opts.map(([v,l])=>`<button data-act="${act}" data-v="${v}" aria-pressed="${String(cur)===String(v)}">${l}</button>`).join('')}</div>`;
  return `
  <div class="gamebar"><button class="link" data-act="home">← Back to the game</button></div>
  <div class="stack">
    <div><div class="eyebrow">For parents</div><h1 class="display" style="font-size:clamp(48px,9vw,72px)">Coach's Office</h1></div>
    <section class="panel stack"><div class="eyebrow">Player</div>
      ${seg('coachPlayer', ME.id, livePlayers().map(p=>[p.id, esc(p.name)]))}
      <span class="muted" style="font-size:14px">Everything below is ${esc(ME.name)}'s progress and settings. Picking a player here also makes them the one playing on this device.</span>
      <div class="row" style="align-items:end" id="playerzone"><label class="fld">Name<input class="txt" id="rename" maxlength="16" value="${esc(ME.name)}" autocomplete="off"></label>
        <button class="btn" data-act="rename">Save name</button><button class="link" data-act="askRemove">Remove player</button></div>
    </section>
    <div class="kpis">
      <div class="kpi"><span class="eyebrow">Facts answered</span><b class="tnum">${S.stats.answered.toLocaleString()}</b></div>
      <div class="kpi"><span class="eyebrow">Accuracy</span><b class="tnum">${acc}%</b></div>
      <div class="kpi"><span class="eyebrow">Today</span><b class="tnum">${todayN}</b></div>
      <div class="kpi"><span class="eyebrow">Days played</span><b class="tnum">${days}</b></div>
    </div>
    <section class="panel stack"><div class="spread"><div class="eyebrow">Fact map · ×1 to ×12</div><div class="muted" style="font-size:14px">Faded squares aren't in play yet</div></div>
      <div class="heat"><table>${head}${rows}</table></div>
      <div class="legend">${LV.map(l=>`<span><i style="background:${l.c}"></i>${l.t}</span>`).join('')}</div>
      <div id="cellinfo" style="text-align:center">${sel}</div>
    </section>
    <section class="panel stack"><div class="eyebrow">Foundations · the three core tables every strategy builds on</div>
      <div class="row" style="gap:24px">${ANCHORS.map(id => { const st = anchorState(id); return `<span style="font-size:18px"><b>×${STRATS[id].n}</b> <span class="${st==='solid'?'plus':st==='weak'?'minus':'muted'}">${STATE_LABEL[st]}</span></span>`; }).join('')}</div>
      <p class="muted" style="margin:0">Solid means right and under 5 seconds. Training Camp works on these first; strategies unlock once all three are solid.</p></section>
    ${trouble.length ? `<section class="panel stack"><div class="eyebrow">Trickiest facts right now</div><div class="trouble">${trouble.map(t=>{const [a,b]=t.k.split('x');return `<span>${a}×${b}</span>`;}).join('')}</div><p class="muted" style="margin:0">The game automatically shows these more often.</p></section>` : ''}
    <section class="panel stack"><div class="eyebrow">Settings</div>
      <div class="stack" style="gap:6px"><b>Facts in play</b>${seg('setRange', S.settings.range, [['auto',`Auto (now ×1–${S.unlocked})`],['10','×1–10'],['11','×1–11'],['12','×1–12']])}
        <span class="muted" style="font-size:14px">Auto adds ×11 once most of ×2–10 are solid, then ×12 once ×11 is solid.</span></div>
      <div class="stack" style="gap:6px"><b>Game clock per play</b>${seg('setTimer', S.settings.timer, [['auto',`Adaptive (now ${PACE[S.pace]}s)`],[20,'Fixed 20s'],[12,'Fixed 12s'],[8,'Fixed 8s'],[5,'Fixed 5s']])}
        <span class="muted" style="font-size:14px">Adaptive speeds up one step after 3 right in a row and slows down one step after 2 misses (${PACE[0]}s down to ${PACE[PACE.length-1]}s). Answers in the first 40% of the clock count as “fast” big plays.</span></div>
      <div class="stack" style="gap:6px"><b>Sound</b>${seg('setSound', S.settings.sound, [[true,'On'],[false,'Off']])}</div>
      <div class="stack" style="gap:6px"><b>Voice</b>
        ${(() => { const vs = Voice.ranked(), curV = Voice.current();
          if(!vs.length) return `<span class="muted" style="font-size:14px">This browser has no voices to read facts aloud.</span>`;
          return `<div class="row"><select class="txt" id="voiceSel" style="max-width:420px;font-size:17px">${vs.map(v => `<option value="${esc(v.voiceURI)}" ${curV && v.voiceURI===curV.voiceURI ? 'selected' : ''}>${esc(v.name)}${Voice.score(v) >= 45 ? ' ★' : ''}</option>`).join('')}</select>
            <button class="btn" data-act="testVoice">Test voice</button></div>`; })()}
        <span class="muted" style="font-size:14px">★ = natural-sounding. For the best voices, download one: on iPad, <b>Settings → Accessibility → Spoken Content → Voices → English</b> and pick a <b>Premium</b> or <b>Enhanced</b> voice (Ava and Zoe are good). On a Mac, <b>System Settings → Accessibility → Spoken Content → System voice → Manage Voices</b>. Then reload the game. This choice is saved for this device.</span></div>
    </section>
    ${cloudPanel()}
    <section class="stack" id="resetzone"><div><button class="link" data-act="askReset">Reset ${esc(ME.name)}'s progress</button></div></section>
    <p class="muted" style="font-size:14px;margin:0">Progress is always saved in this browser${Cloud.code?' and backed up to the cloud':''}. Without a family code, clearing Safari's website data erases it.</p>
  </div>`;
}
ACT.cell = d => { coachSel = [+d.a, +d.b]; render(); };
ACT.setRange = d => { S.settings.range = d.v; save(); render(); };
ACT.setTimer = d => { S.settings.timer = d.v==='auto' ? 'auto' : +d.v; save(); render(); };
ACT.setSound = d => { S.settings.sound = d.v==='true'; save(); render(); };
ACT.testVoice = () => say('7 times 8 is 56', true);
document.addEventListener('change', e => { if(e.target.id==='voiceSel'){ Voice.set(e.target.value); say('7 times 8 is 56', true); } });
ACT.askReset = () => { document.getElementById('resetzone').innerHTML = `<div class="row"><span>Erase ${esc(ME.name)}'s teams and fact history?</span><button class="btn danger" data-act="reset">Erase everything</button><button class="btn" data-act="coach">Cancel</button></div>`; };
ACT.reset = () => { S = ME.save = normalize(null); save(); toast(`${ME.name}'s progress erased.`); go('home'); };
ACT.coachPlayer = d => { setMe(d.v); render(); };
ACT.rename = () => { const n = (document.getElementById('rename').value||'').trim(); if(!n){ toast('Type a name first.'); return; } ME.name = n; save(); toast('Name saved.'); render(); };
ACT.askRemove = () => { document.getElementById('playerzone').innerHTML = `<span>Remove ${esc(ME.name)} and all their teams${Cloud.code?' from every device':''}?</span><button class="btn danger" data-act="removePlayer">Remove ${esc(ME.name)}</button><button class="btn" data-act="coach">Cancel</button>`; };
ACT.removePlayer = () => {
  const p = ME, name = p.name;
  p.deleted = true; p.updated = Date.now(); delete p.save;
  setMe(''); saveLocal(); Cloud.push(p);
  toast(`${name} was removed.`); go('players');
};

render();
Cloud.sync();
</script>
